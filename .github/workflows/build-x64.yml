name: Build x64

on:
  push:
    branches: [master]
    # ドキュメントだけの変更で約40分のフル MSI ビルドを走らせない
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  SWIFT_VERSION: "6.2.1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # LLAMA_CPP_REPO / LLAMA_CPP_VERSION の正準定義（Zenzai用パッチ入りfork）
      - name: Load llama.cpp version
        shell: bash
        run: cat scripts/llama-cpp-version.env >> "$GITHUB_ENV"

      - name: Load Vulkan SDK version
        shell: bash
        run: cat scripts/vulkan-sdk-version.env >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check DLL lists are consistent
        shell: pwsh
        run: python scripts/ci/check-dll-lists.py

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Verify Swift installation
        run: swift --version

      - name: Install Bazelisk
        run: |
          choco install bazelisk --version 1.29.0 -y
          bazelisk version

      - name: Install Vulkan SDK
        shell: pwsh
        run: scripts/ci/install-vulkan-sdk.ps1

      - name: Cache Qt build
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: mozc/src/third_party/qt
          key: qt-windows-x64-v2-${{ hashFiles('mozc/src/build_tools/build_qt.py') }}

      # NOTE: 以前は ~/.cache/bazel をキャッシュしていたが、Windows の Bazel は
      # %USERPROFILE%\_bazel_* / %LocalAppData%\bazelisk を使うため実効性がなかった
      # (毎回外部依存をフル fetch していた)。--repository_cache を明示パスに固定し、
      # それと bazelisk のダウンロードキャッシュを保存する。
      - name: Cache Bazel repository
        uses: actions/cache@v5
        with:
          path: |
            .bazel-repo-cache
            ~/AppData/Local/bazelisk
          key: bazel-repo-windows-x64-${{ hashFiles('mozc/src/MODULE.bazel', 'mozc/src/.bazeliskrc') }}
          restore-keys: |
            bazel-repo-windows-x64-

      # Bazel のアクションキャッシュ(コンパイル結果)。exact key(sha)は毎回異なるため
      # 各実行が新キーで保存し、次回は restore-keys で直近を復元する（ローリング方式）。
      # バージョン注入は version.bzl の書き換えで行う（下の Compute Mozc auto version 参照）。
      # かつての --action_env=MOZC_VERSION 方式は全アクションのキャッシュキーを汚染し、
      # 同一ソースの再ビルドでも 37分かかっていた（2026-08-03 実測・ヒット率 0%）
      - name: Cache Bazel disk cache
        uses: actions/cache@v5
        with:
          path: .bazel-disk-cache
          key: bazel-disk-windows-x64-${{ github.sha }}
          restore-keys: |
            bazel-disk-windows-x64-

      - name: Cache Swift Package Manager
        uses: actions/cache@v5
        with:
          path: src/swift-engine/.build
          key: swift-pm-windows-x64-${{ hashFiles('src/swift-engine/Package.swift', 'src/swift-engine/Package.resolved') }}
          restore-keys: |
            swift-pm-windows-x64-

      - name: Cache llama.cpp build
        id: cache-llama
        uses: actions/cache@v5
        with:
          path: llama.cpp-build
          key: llama-cpp-windows-x64-dl-vulkan-${{ env.LLAMA_CPP_VERSION }}

      - name: Create build directories
        run: mkdir -p build/x64/release
        shell: bash

      # Build llama.cpp
      - name: Build llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\ci\build-llama-cpp.bat x64 %LLAMA_CPP_VERSION% llama.cpp-build

      - name: Copy llama.cpp DLLs
        shell: pwsh
        run: scripts/ci/copy-llama-dlls.ps1 -Arch x64 -SourceDir llama.cpp-build

      # Build Swift DLL
      - name: Build Swift DLL
        shell: pwsh
        run: |
          Set-Location src/swift-engine
          swift build -c release --arch x86_64
          # Find the actual DLL path (symlink may fail on CI)
          $dllPath = Get-ChildItem -Path .build -Recurse -Filter "azookey-engine.dll" | Where-Object { $_.FullName -match "release" } | Select-Object -First 1
          if ($dllPath) {
            Copy-Item -Force $dllPath.FullName -Destination "../../build/x64/release/"
            Write-Host "Copied from: $($dllPath.FullName)"
          } else {
            throw "azookey-engine.dll not found"
          }
          # Copy Swift resource bundles (dictionary data)
          $buildDir = $dllPath.DirectoryName
          $outputDir = "../../build/x64/release"
          foreach ($bundle in @(
            "AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.resources",
            "AzooKeyKanaKanjiConverter_EfficientNGram.resources"
          )) {
            $src = Join-Path $buildDir $bundle
            if (Test-Path $src) {
              Copy-Item -Recurse -Force $src -Destination (Join-Path $outputDir $bundle)
              Write-Host "Copied resource bundle: $bundle"
            } else {
              Write-Host "WARNING: Resource bundle not found: $src"
            }
          }

      - name: Copy Swift Runtime DLLs
        shell: pwsh
        run: scripts/ci/copy-swift-runtime.ps1 -OutputDir build/x64/release

      # 配布 MSI を作る経路にもテストの網をかける（#51）。PR Tests と同じ swift test に加え、
      # ビルド済み DLL を使う Python 回帰テスト（タイポ補正の出るべき/出ないべきケース）を回す。
      - name: Test Swift package
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\src\AzooKeyKanaKanjiConverter\lib\windows;$env:PATH"
          Set-Location src/swift-engine
          swift test -c release

      - name: Run engine regression tests (typo correction)
        shell: pwsh
        env:
          # テストは日本語を出力する。Windows ランナーの既定 stdout（cp1252）だと
          # UnicodeEncodeError で落ちるため UTF-8 モードにする
          PYTHONUTF8: "1"
        run: |
          python scripts/tests/typo_conversion_test.py
          if ($LASTEXITCODE -ne 0) { throw "typo_conversion_test.py failed" }
          python scripts/tests/typo_clean_sweep_test.py
          if ($LASTEXITCODE -ne 0) { throw "typo_clean_sweep_test.py failed" }

      # Build Mozc
      - name: Download Qt source
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/ci/download-qt.ps1 -OutputDir mozc/src/third_party_cache

      - name: Build Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: mozc/src
        run: python build_tools/build_qt.py --release --confirm_license

      - name: Clean Qt source
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force mozc/src/third_party/qt_src -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force mozc/src/third_party_cache -ErrorAction SilentlyContinue

      - name: Update Mozc dependencies
        shell: cmd
        working-directory: mozc/src
        run: python build_tools/update_deps.py --noqt --nollvm --nomsys2 --nondk

      # バージョンは version.bzl の書き換えで注入する。このファイルは
      # //base:mozc_version_txt アクションの入力なので、無効化されるのは刻印を参照する
      # ターゲットだけで済む。--action_env=MOZC_VERSION 方式は全アクションの環境
      # （=キャッシュキー）に値が入るため、毎回全キャッシュミスになる
      - name: Compute Mozc auto version
        shell: bash
        run: |
          days=$(( ($(date -u +%s) - $(date -u -d 2009-05-24 +%s)) / 86400 ))
          revision=$(date -u +%H%M)
          revision=$((10#$revision))
          version="3.33.${days}.${revision}"
          sed -i -e "s/^BUILD_OSS = .*/BUILD_OSS = ${days}/" \
                 -e "s/^REVISION = .*/REVISION = ${revision}/" mozc/src/version.bzl
          grep -E "^(MAJOR|MINOR|BUILD_OSS|REVISION) = " mozc/src/version.bzl
          echo "MOZC_AUTO_VERSION=${version}" >> "$GITHUB_ENV"
          echo "MOZC_AUTO_VERSION=${version}"

      - name: Build Mozc x64 MSI
        shell: cmd
        working-directory: mozc/src
        run: bazelisk build --repository_cache=%GITHUB_WORKSPACE%\.bazel-repo-cache --disk_cache=%GITHUB_WORKSPACE%\.bazel-disk-cache --config=oss_windows --spawn_strategy=local //win32/installer:installer_x64

      # エンジン DLL を使う Mozc のテスト（#51）。bazel test はテスト実行体を runfiles から実行するため
      # bazel-bin に DLL を置いても見つからず、MYIME_AZOOKEY_DLL_DIR で配置先を明示する。
      # MYIME_HERMETIC_TEST=1 は engine_config.h の hermetic test-mode の明示スイッチで、
      # レジストリとモデル探索を無視し（Zenzai は走らない）、学習データを TEST_TMPDIR に置く。
      # //session:session_handler_scenario_test は Mozc 辞書前提の期待値（15 シナリオ）が残るため
      # 扱いを決めるまで対象外（docs/build.md「Mozc のテストをエンジン DLL 有りで走らせる」参照）。
      - name: Test Mozc with engine DLL
        shell: cmd
        working-directory: mozc/src
        run: bazelisk test --repository_cache=%GITHUB_WORKSPACE%\.bazel-repo-cache --disk_cache=%GITHUB_WORKSPACE%\.bazel-disk-cache --config=oss_windows --spawn_strategy=local --test_env=MYIME_HERMETIC_TEST=1 --test_env=MYIME_AZOOKEY_DLL_DIR=%GITHUB_WORKSPACE%\build\x64\release //converter:azookey_candidate_parser_test //converter:azookey_user_dictionary_test //session:session_handler_test //session:session_test

      - name: Copy MSI
        run: copy mozc\src\bazel-bin\win32\installer\Mozc_x64.msi .
        shell: cmd

      # Upload artifacts
      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: Mozc_x64
          path: Mozc_x64.msi
          retention-days: 30

      - name: Upload DLLs
        uses: actions/upload-artifact@v7
        with:
          name: azookey-dlls-x64
          path: build/x64/release/
          retention-days: 30
