name: Build arm64 (disabled)

# ARM64 CI is temporarily disabled due to:
# - Bazel issue #22164: C++ toolchain resolution broken on ARM64 Windows
# - Swift ARM64 cross-compilation not supported
# Re-enable when these issues are resolved.
#
# 注意 (2026-06): mozc の upstream rebase により installer_arm64 ターゲットは
# 廃止済み (universal installer 方式に移行)。再開時はこの workflow の
# ターゲット名・MSI パスの再設計が必要。docs/upstream-divergence.md 参照。

on:
  workflow_dispatch:  # Manual trigger only

env:
  SWIFT_VERSION: "6.2.1"

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # LLAMA_CPP_REPO / LLAMA_CPP_VERSION の正準定義（Zenzai用パッチ入りfork）
      - name: Load llama.cpp version
        shell: bash
        run: cat scripts/llama-cpp-version.env >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Verify Swift installation
        run: swift --version

      - name: Install Bazelisk
        run: |
          choco install bazelisk -y
          bazelisk version

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $vulkanVersion = "1.3.296.0"
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanSDK-$vulkanVersion-Installer.exe"
          $installerPath = "$env:TEMP\VulkanSDK-Installer.exe"

          Write-Host "Downloading Vulkan SDK $vulkanVersion..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath $installerPath -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait

          # Set environment variable
          $vulkanPath = "C:\VulkanSDK\$vulkanVersion"
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
          echo "$vulkanPath\Bin" >> $env:GITHUB_PATH

      - name: Cache Qt build
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: mozc/src/third_party/qt
          key: qt-windows-arm64-v2-${{ hashFiles('mozc/src/build_tools/build_qt.py') }}

      - name: Cache Bazel repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-windows-arm64-${{ hashFiles('mozc/src/MODULE.bazel', 'mozc/src/.bazelrc') }}
          restore-keys: |
            bazel-windows-arm64-

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: src/swift-engine/.build
          key: swift-pm-windows-arm64-${{ hashFiles('src/swift-engine/Package.swift', 'src/swift-engine/Package.resolved') }}
          restore-keys: |
            swift-pm-windows-arm64-

      - name: Cache llama.cpp build
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp-build
          key: llama-cpp-windows-arm64-vulkan-${{ env.LLAMA_CPP_VERSION }}

      - name: Create build directories
        run: mkdir -p build/arm64/release
        shell: bash

      # Build llama.cpp
      - name: Build llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\ci\build-llama-cpp.bat arm64 %LLAMA_CPP_VERSION% llama.cpp-build

      - name: Copy llama.cpp DLLs
        shell: pwsh
        run: scripts/ci/copy-llama-dlls.ps1 -Arch arm64 -SourceDir llama.cpp-build

      # Build Swift DLL
      - name: Build Swift DLL
        shell: pwsh
        run: |
          Set-Location src/swift-engine
          swift build -c release
          # Find the actual DLL path (symlink may fail on CI)
          $dllPath = Get-ChildItem -Path .build -Recurse -Filter "azookey-engine.dll" | Where-Object { $_.FullName -match "release" } | Select-Object -First 1
          if ($dllPath) {
            Copy-Item -Force $dllPath.FullName -Destination "../../build/arm64/release/"
            Write-Host "Copied from: $($dllPath.FullName)"
          } else {
            throw "azookey-engine.dll not found"
          }

      - name: Copy Swift Runtime DLLs
        shell: pwsh
        run: scripts/ci/copy-swift-runtime.ps1 -OutputDir build/arm64/release

      # Build Mozc
      - name: Download Qt source
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/ci/download-qt.ps1 -OutputDir mozc/src/third_party_cache

      - name: Build Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: mozc/src
        run: python build_tools/build_qt.py --release --confirm_license

      - name: Clean Qt source
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force mozc/src/third_party/qt_src -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force mozc/src/third_party_cache -ErrorAction SilentlyContinue

      - name: Update Mozc dependencies
        shell: cmd
        working-directory: mozc/src
        run: python build_tools/update_deps.py --noqt --nollvm --nomsys2 --nondk --nosubmodules

      - name: Build Mozc arm64 MSI
        shell: cmd
        working-directory: mozc/src
        # Use oss_windows (not oss_windows_arm64) because --platforms flag breaks
        # toolchain resolution on ARM64 Windows (Bazel issue #22164).
        # Native ARM64 build on ARM64 runner doesn't need explicit platform.
        run: bazelisk build --config=oss_windows --spawn_strategy=local //win32/installer:installer_arm64

      - name: Copy MSI
        run: copy mozc\src\bazel-bin\win32\installer\Mozc_arm64.msi .
        shell: cmd

      # Upload artifacts
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Mozc_arm64
          path: Mozc_arm64.msi
          retention-days: 30

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: azookey-dlls-arm64
          path: build/arm64/release/
          retention-days: 30
