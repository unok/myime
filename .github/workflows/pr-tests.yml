name: PR Tests

on:
  pull_request:
    branches: [master]
    # ドキュメントだけの PR ではビルド・テストを走らせない
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  SWIFT_VERSION: "6.3.3"

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # LLAMA_CPP_REPO / LLAMA_CPP_VERSION の正準定義（Zenzai用パッチ入りfork）
      - name: Load llama.cpp version
        shell: bash
        run: cat scripts/llama-cpp-version.env >> "$GITHUB_ENV"

      - name: Load Vulkan SDK version
        shell: bash
        run: cat scripts/vulkan-sdk-version.env >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check DLL lists are consistent
        shell: pwsh
        run: python scripts/ci/check-dll-lists.py

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Verify Swift installation
        run: swift --version

      - name: Install Bazelisk
        run: |
          choco install bazelisk --version 1.29.0 -y
          bazelisk version

      # NOTE: PR ではキャッシュを「復元のみ」にする（actions/cache/restore）。
      # PR ごとに 1GB 超の bazel-disk キャッシュを保存すると、リポジトリ上限 10GB の
      # LRU で master の Qt / llama / Swift キャッシュが追い出され、master のフル
      # ビルドが 40分 → 1時間20分超に悪化した（2026-08-03 実測）。保存は master の
      # Build x64 だけが行い、PR は master の最新キャッシュを読むだけにする。
      - name: Restore Bazel repository cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .bazel-repo-cache
            ~/AppData/Local/bazelisk
          key: bazel-repo-windows-x64-${{ hashFiles('mozc/src/MODULE.bazel', 'mozc/src/.bazeliskrc') }}
          restore-keys: |
            bazel-repo-windows-x64-

      # Bazel のアクションキャッシュ(コンパイル結果)。master が保存した直近を
      # restore-keys で復元する。master のバージョン注入は version.bzl 書き換え方式の
      # ため（--action_env ではない）、刻印参照以外のアクションキーは PR と一致し、
      # C++ コンパイル本体のキャッシュがそのまま使える
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v5
        with:
          path: .bazel-disk-cache
          key: bazel-disk-windows-x64-${{ github.sha }}
          restore-keys: |
            bazel-disk-windows-x64-

      - name: Restore Swift Package Manager cache
        uses: actions/cache/restore@v5
        with:
          path: src/swift-engine/.build
          key: swift-pm-windows-x64-${{ env.SWIFT_VERSION }}-${{ hashFiles('src/swift-engine/Package.swift', 'src/swift-engine/Package.resolved') }}
          restore-keys: |
            swift-pm-windows-x64-${{ env.SWIFT_VERSION }}-

      - name: Restore llama.cpp build cache
        id: cache-llama
        uses: actions/cache/restore@v5
        with:
          path: llama.cpp-build
          key: llama-cpp-windows-x64-dl-vulkan-${{ env.LLAMA_CPP_VERSION }}

      - name: Install Vulkan SDK
        if: steps.cache-llama.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/ci/install-vulkan-sdk.ps1

      - name: Create build directories
        run: mkdir -p build/x64/release
        shell: bash

      # Build llama.cpp
      - name: Build llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\ci\build-llama-cpp.bat x64 %LLAMA_CPP_VERSION% llama.cpp-build

      - name: Copy llama.cpp DLLs
        shell: pwsh
        run: scripts/ci/copy-llama-dlls.ps1 -Arch x64 -SourceDir llama.cpp-build

      # Build Swift DLL
      - name: Build Swift DLL
        shell: pwsh
        run: |
          Set-Location src/swift-engine
          swift build -c release --arch x86_64
          # Find the actual DLL path (symlink may fail on CI)
          $dllPath = Get-ChildItem -Path .build -Recurse -Filter "azookey-engine.dll" | Where-Object { $_.FullName -match "release" } | Select-Object -First 1
          if ($dllPath) {
            Copy-Item -Force $dllPath.FullName -Destination "../../build/x64/release/"
            Write-Host "Copied from: $($dllPath.FullName)"
          } else {
            throw "azookey-engine.dll not found"
          }
          # Copy Swift resource bundles (dictionary data)
          $buildDir = $dllPath.DirectoryName
          $outputDir = "../../build/x64/release"
          foreach ($bundle in @(
            "AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.resources",
            "AzooKeyKanaKanjiConverter_EfficientNGram.resources"
          )) {
            $src = Join-Path $buildDir $bundle
            if (Test-Path $src) {
              Copy-Item -Recurse -Force $src -Destination (Join-Path $outputDir $bundle)
              Write-Host "Copied resource bundle: $bundle"
            } else {
              Write-Host "WARNING: Resource bundle not found: $src"
            }
          }

      - name: Test Swift package
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\src\AzooKeyKanaKanjiConverter\lib\windows;$env:PATH"
          Set-Location src/swift-engine
          swift test -c release

      - name: Copy Swift Runtime DLLs
        shell: pwsh
        run: scripts/ci/copy-swift-runtime.ps1 -OutputDir build/x64/release

      - name: Update Mozc dependencies
        shell: cmd
        working-directory: mozc/src
        run: python build_tools/update_deps.py --noqt --nollvm --nomsys2 --nondk

      # :all はテストバイナリの全リンクを引き込み25分かかったため、
      # 実行するテスト（次ステップで依存をビルド）と Windows 固有の tip に絞る。
      - name: Build Bazel targets (win32/tip)
        shell: cmd
        working-directory: mozc/src
        run: bazelisk build --repository_cache=%GITHUB_WORKSPACE%\.bazel-repo-cache --disk_cache=%GITHUB_WORKSPACE%\.bazel-disk-cache --config=oss_windows --spawn_strategy=local //win32/tip:tip_text_service_impl

      # //session:session_test と //session:session_handler_myime_scenario_test は azookey-engine.dll が必要なため対象外（Build x64 で実行。テスト自体の無効化ではなく実行環境の制約）
      - name: Test Bazel targets
        shell: cmd
        working-directory: mozc/src
        run: bazelisk test --repository_cache=%GITHUB_WORKSPACE%\.bazel-repo-cache --disk_cache=%GITHUB_WORKSPACE%\.bazel-disk-cache --config=oss_windows --spawn_strategy=local //converter:azookey_candidate_parser_test //converter:azookey_user_dictionary_test //rewriter:word_register_rewriter_test //rewriter:merger_rewriter_test //rewriter:rewriter_test //engine:engine_converter_test //session:session_handler_test //config:config_handler_test //win32/tip:tip_passthrough_key_test //prediction:dictionary_predictor_myime_test
